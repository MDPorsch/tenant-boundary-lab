[project]
name = "tenant-boundary-lab"
version = "0.0.0"
description = "Isolated lab, independent policy oracle and Python runner for API authorization regression testing (BOLA/BFLA/BOPLA)."
readme = "README.md"
authors = [{ name = "MDPorsch" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["security", "authorization", "BOLA", "BFLA", "OWASP", "API security", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
requires-python = ">=3.13,<3.14"
# Lower bounds = versions resolved on 2026-11-19; upper bounds stop silent major
# upgrades. Exact, hash-pinned versions live in uv.lock (the source of truth).
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.165.0,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14.4,<3",
    "pyjwt[crypto]>=2.15.1,<3",
    "sqlalchemy>=2.1.9,<3",
    "typer>=0.29.2,<1",
]

[project.optional-dependencies]
lab = [
    "uvicorn>=0.54.0,<1",
]

[project.urls]
Homepage = "https://github.com/MDPorsch/tenant-boundary-lab"
Source = "https://github.com/MDPorsch/tenant-boundary-lab"
Issues = "https://github.com/MDPorsch/tenant-boundary-lab/issues"
Security = "https://github.com/MDPorsch/tenant-boundary-lab/security/policy"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15,<7",
    "mypy>=2.4.1,<3",
    "pip-audit>=2.10.1,<3",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.5.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pyyaml>=6.0.3,<7",
    "ruff>=0.17.6,<1",
    "uvicorn>=0.54.0,<1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tenantlab"
# D-43: the deliberately vulnerable lab is NOT shipped in the wheel. It exists only in a source
# checkout (and in the container image built from one). tests/negative/test_m3_isolation.py builds
# the wheel and fails if this is ever removed.
wheel-exclude = ["tenantlab/lab/vulnerable/**"]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    # `milestone("M1")` marks a test that specifies behaviour not built yet.
    # It is informational only: such tests are expected to FAIL until that
    # milestone ships, and must never be skipped or xfailed to hide that.
    "milestone(name): the milestone (M1..M6) that must make this test pass",
    # Needs a running Docker daemon. NOT skipped: without Docker these tests FAIL with a message
    # that names the exact deselect command, so a missing daemon is never mistaken for a pass.
    "docker: needs a Docker daemon (build and run the vulnerable-lab container)",
]

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PT", "ASYNC", "T20", "PL",
]
ignore = ["PLR2004"]  # magic values are normal in test assertions

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; the harness hand-crafts hostile tokens.
"tests/**" = ["S101", "S105", "S106", "S311", "S104", "PLR0913"]
# S311: seeded PRNG for statistics. S104: "0.0.0.0" is the hostile INPUT the M3 guards must refuse.
# Developer tooling: long one-line patches are the point; it runs subprocesses on purpose.
"tools/**" = ["E501", "PLR0913", "T201"]  # command-line tools print by design

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
branch = true
source = ["tenantlab"]

[tool.coverage.report]
show_missing = true
skip_covered = false
