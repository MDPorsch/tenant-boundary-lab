name: CI

on:
  push:
    branches: [main]
  pull_request:          # never pull_request_target: untrusted code runs with no secrets and a read-only token
  workflow_dispatch:

permissions: {}          # nothing by default; each job asks for exactly what it needs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"          # the lockfile is the source of truth: never re-resolve in CI

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q -m "not docker" --cov=tenantlab --cov-report=term-missing

  container:
    name: vulnerable-lab container isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --all-extras
      - run: docker version
      - run: uv run pytest -q -m "docker and not postgres"

  postgres:
    name: PostgreSQL concurrency, and the functional suites on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --all-extras
      - run: docker version
      # The tests start their own throwaway PostgreSQL container from an image pinned by digest
      # (tests/pgserver.py): a random password, a random loopback port, removed at the end.
      - name: Concurrency tests (TL-11, TL-12, TL-20, the quota) on a real PostgreSQL server
        run: uv run pytest -q -m postgres
      - name: The M1 and M2 suites against PostgreSQL (the timing test stays on SQLite)
        run: uv run pytest -q tests/negative/test_m1_*.py tests/negative/test_m2_*.py --ignore=tests/negative/test_m2_timing.py
        env:
          TENANTLAB_TEST_DB: postgres

  supply-chain:
    name: dependency audit and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # the whole history is scanned, not just the tip
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pip-audit
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history and tree (first proves the scanner can detect a canary)
        run: uv run python tools/secret_scan.py
