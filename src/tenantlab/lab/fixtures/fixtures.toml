# Synthetic fixtures for the Tenant Boundary Lab (M0 contract).
#
# Everything here is FICTIONAL. No real people, clients, domains or credentials.
# Emails use the reserved ".invalid" TLD (RFC 2606/6761).
#
# UUID scheme (valid UUIDv4 shape, hand-readable):
#   principals 1000..., tenants 2000..., markets 3000..., memberships 4000...,
#   projects 5000..., invoices 6000..., contacts 7000...   ; last byte = sequence number.
#   Suffix "ff" is reserved for ids that are NEVER seeded (existence-oracle probes, TL-04).
#
# Leak sentinels: every tenant-owned title contains SENTINEL-TENANT-<x>; every private
# contact value contains SENTINEL-PRIV. A response that shows a sentinel to an actor who
# must not see it is a leak, independent of status codes.

[meta]
version = 1
private_sentinel = "SENTINEL-PRIV"
tenant_sentinel_prefix = "SENTINEL-TENANT-"

[meta.never_seeded]
principal = "10000000-0000-4000-8000-0000000000ff"
tenant = "20000000-0000-4000-8000-0000000000ff"
project = "50000000-0000-4000-8000-0000000000ff"
invoice = "60000000-0000-4000-8000-0000000000ff"

