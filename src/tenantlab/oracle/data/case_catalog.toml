[[cases]]
id = "TL-17"
title = "Database write occurs and then a 403 is returned"
owasp = ["API5:2023", "API1:2023"]
milestones = ["M4"]
state = "green"
mutation_allowed = false
test_modules = ["tests/negative/test_m4_forbidden_mutation.py", "tests/unit/test_state_diff_helpers.py"]
expected = "Against a deliberately broken fixture that writes before denying, the runner reports a policy violation from the state diff although the status code matches the oracle; the run exits 1, never 0."

[[cases]]
id = "TL-18"
title = "Client-supplied identity or role headers/body"
owasp = ["API3:2023", "API5:2023"]
milestones = ["M1"]
state = "green"
mutation_allowed = false
test_modules = ["tests/negative/test_m1_untrusted_context.py"]
expected = "X-User, X-Role, X-Tenant-Id, X-Forwarded-For and X-Forwarded-User headers are ignored (context reports the token principal and DB role); a body or query carrying role=owner never raises authority (PATCH by a viewer is 403 before the body is processed); a client X-Request-ID is never echoed; business tables unchanged."

[[cases]]
id = "TL-19"
title = "List totals and timing reveal hidden data"
owasp = ["API1:2023", "API3:2023"]
milestones = ["M2"]
state = "green"
mutation_allowed = false
test_modules = ["tests/negative/test_m2_properties.py", "tests/negative/test_m2_timing.py"]
expected = "The list total equals the number of objects the actor may read; adding rows to another tenant or to a hidden market never changes it. Timing: every not-visible outcome (hidden market, foreign tenant, revoked member, missing id) of a route runs the identical SQL sequence, and an interleaved permutation test finds no repeatable timing difference of 15% or more; constant-time behaviour is explicitly NOT claimed (LIMITATIONS L-07, L-24). Business tables unchanged."

[[cases]]
id = "TL-20"
title = "Overlapping membership and market-access changes"
owasp = ["API1:2023"]
milestones = ["M5"]
state = "green"
mutation_allowed = true
test_modules = ["tests/postgres/test_m5_concurrency.py"]
expected = "On PostgreSQL, an authority change (membership revoked or downgraded, principal disabled, tenant suspended, market access removed) cannot complete while a write that relies on that authority is in flight: authority is re-queried and LOCKED inside the write transaction, so the change waits for the write (or the write is refused) and writes are never ordered after the revocation that should have stopped them. Concurrent creates cannot exceed the quota. Reads keep the documented check-then-use window (LIMITATIONS L-16)."
