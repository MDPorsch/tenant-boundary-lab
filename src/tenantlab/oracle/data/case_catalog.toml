[[cases]]
id = "TL-16"
title = "Vulnerable router enabled outside the local lab"
owasp = ["API8:2023"]
milestones = ["M3"]
state = "green"
mutation_allowed = false
test_modules = ["tests/negative/test_m3_isolation.py", "tests/negative/test_m3_flaws.py", "tests/docker/test_vulnerable_lab_container.py"]
