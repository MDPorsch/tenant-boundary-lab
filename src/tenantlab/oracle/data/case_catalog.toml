[[cases]]
id = "TL-14"
title = "Suspended tenant or changed membership state with prior access"
owasp = ["API1:2023"]
milestones = ["M1"]
state = "green"
mutation_allowed = false
test_modules = ["tests/negative/test_m1_tenant_gates.py"]
expected = "gina (owner of suspended C): 403 tenant.suspended. alice allowed on A, then tenant A is suspended in the DB: next request 403 tenant.suspended; reactivated: allowed again (state is re-read, never cached); never-seeded tenant id is 404. Business tables unchanged apart from the test's own tenant-state flips."

[[cases]]
id = "TL-15"
title = "UTF-8, overlong fields, unknown keys, type confusion"
owasp = ["API3:2023", "API4:2023"]
milestones = ["M2"]
state = "green"
mutation_allowed = false
test_modules = ["tests/negative/test_m2_input.py"]
